[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "clipper2-py"
version = "0.1.0"
description = "Python bindings for Clipper2: polygon clipping, offsetting and triangulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND BSL-1.0"
license-files = ["LICENSE", "third_party/Clipper2/LICENSE"]
authors = [{ name = "Maksim Burtsev", email = "mburtsev17@gmail.com" }]
keywords = ["clipper", "clipper2", "polygon", "clipping", "offsetting", "boolean", "geometry", "triangulation", "minkowski", "cam", "gis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/Maksim-Burtsev/clipper2-py"
Issues = "https://github.com/Maksim-Burtsev/clipper2-py/issues"
Upstream = "https://github.com/AngusJohnson/Clipper2"

[project.optional-dependencies]
test = ["pytest", "mypy"]

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/clipper2"]

# The sdist vendors the Clipper2 submodule; keep the C++ library, its license and the test data.
[tool.scikit-build.sdist]
exclude = [
  "third_party/Clipper2/CSharp",
  "third_party/Clipper2/Delphi",
  "third_party/Clipper2/DLL",
  "third_party/Clipper2/.github",
  "third_party/Clipper2/CPP/Examples",
  "third_party/Clipper2/CPP/BenchMark",
  "third_party/Clipper2/CPP/Utils",
  "benchmarks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "cp3??t-* *-musllinux_*"
build-verbosity = 1
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"
test-skip = "*-macosx_x86_64"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.13"
